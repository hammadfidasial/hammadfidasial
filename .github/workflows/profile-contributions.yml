name: Profile contribution animation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-contributions.yml']
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Render the contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-dark.svg?palette=github-dark&color_snake=%23FFCF8A&color_dots=%23132936,%231A4C50,%23287670,%2343A693,%2375E3C7
            dist/contributions-light.svg?palette=github-light&color_snake=%23945D17&color_dots=%23E7F1EF,%23AFDED3,%2363B9A7,%232A847B,%23114B4A
      - name: Publish both themes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git --hostname github.com

          publish_dir="$(mktemp -d)"
          git -C "$publish_dir" init -q --initial-branch=profile-activity
          git -C "$publish_dir" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          existing_ref="$(git -C "$publish_dir" ls-remote origin refs/heads/profile-activity)"
          if [[ -n "$existing_ref" ]]; then
            git -C "$publish_dir" fetch --depth=1 origin profile-activity
            git -C "$publish_dir" reset --hard FETCH_HEAD
          fi

          cp dist/contributions-{dark,light}.svg "$publish_dir/"
          git -C "$publish_dir" add contributions-dark.svg contributions-light.svg
          if git -C "$publish_dir" diff --cached --quiet; then
            exit 0
          fi

          git -C "$publish_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh contribution animation'
          git -C "$publish_dir" push origin HEAD:refs/heads/profile-activity
