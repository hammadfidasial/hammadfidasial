name: Profile contribution animation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-contributions.yml
      - .github/scripts/render_profile_activity.py
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the activity card renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Render the contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-dark.svg?palette=github-dark&color_snake=%23EAB997&color_dots=%23331B2C,%23552B46,%237C4564,%23AC688B,%23E6AAC7
            dist/contributions-light.svg?palette=github-light&color_snake=%23945D17&color_dots=%23E7F1EF,%23AFDED3,%2363B9A7,%232A847B,%23114B4A
      - name: Add live calendar statistics
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        shell: bash
        run: |
          gh api graphql -f login="$PROFILE_LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }
          ' > dist/calendar.json
          python3 .github/scripts/render_profile_activity.py \
            dist/calendar.json dist/contributions-dark.svg dist/contribution-card.svg "$PROFILE_LOGIN"
      - name: Publish contribution graphics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git --hostname github.com

          publish_dir="$(mktemp -d)"
          git -C "$publish_dir" init -q --initial-branch=profile-activity
          git -C "$publish_dir" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          existing_ref="$(git -C "$publish_dir" ls-remote origin refs/heads/profile-activity)"
          if [[ -n "$existing_ref" ]]; then
            git -C "$publish_dir" fetch --depth=1 origin profile-activity
            git -C "$publish_dir" reset --hard FETCH_HEAD
          fi

          cp dist/contributions-{dark,light}.svg dist/contribution-card.svg "$publish_dir/"
          git -C "$publish_dir" add contributions-dark.svg contributions-light.svg contribution-card.svg
          if git -C "$publish_dir" diff --cached --quiet; then
            exit 0
          fi

          git -C "$publish_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh contribution animation'
          git -C "$publish_dir" push origin HEAD:refs/heads/profile-activity
