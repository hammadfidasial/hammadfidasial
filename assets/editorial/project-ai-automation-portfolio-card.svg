<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">AI Automation Portfolio</title>
  <desc id="desc">12. A showcase of automation services, projects and prototypes. Explore AI agents, integrations and interactive demos.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0D1418"/><stop offset=".54" stop-color="#14272B"/><stop offset="1" stop-color="#0E1D21"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#186B54" stop-opacity=".64"/><stop offset="1" stop-color="#186B54" stop-opacity="0"/></radialGradient>
    <linearGradient id="rail"><stop stop-color="#315C55" stop-opacity=".25"/><stop offset=".47" stop-color="#A5EFCD"/><stop offset="1" stop-color="#315C55" stop-opacity=".25"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#6BD8AF" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="365" rx="19"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="365" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="495" fill="url(#glow)" opacity=".55"/>
    <rect x="650" width="550" height="365" fill="url(#grid)"/>
    <g class="enter" style="--delay:.07s">
      <text x="50" y="49" class="mono" font-size="14" fill="#6BD8AF" letter-spacing="1.9">12  ·  PORTFOLIO  ·  AI AUTOMATION</text>
      <text x="47" y="115" class="serif" font-size="49" fill="#F0FCF6">AI Automation Portfolio</text>
      <text x="51" y="156" class="sans" font-size="20" fill="#ABC6BF">A showcase of automation services, projects and prototypes.</text>
      <text x="52" y="190" class="mono" font-size="15" fill="#A5EFCD">Explore AI agents, integrations and interactive demos.</text>
    </g>
    <path class="draw" pathLength="100" d="M50 216h632" stroke="url(#rail)" fill="none"/>
    <g class="enter" style="--delay:.24s">
      <text x="51" y="262" class="serif" font-size="32" fill="#F0FCF6">Services</text>
      <text x="52" y="285" class="sans" font-size="15" fill="#ABC6BF">AI agents and workflows</text>
    </g>
    <g class="enter" style="--delay:.37s">
      <text x="266" y="262" class="serif" font-size="32" fill="#F0FCF6">Projects</text>
      <text x="267" y="285" class="sans" font-size="15" fill="#ABC6BF">Selected builds</text>
    </g>
    <g class="enter" style="--delay:.50s">
      <text x="481" y="262" class="serif" font-size="32" fill="#F0FCF6">Live demos</text>
      <text x="482" y="285" class="sans" font-size="15" fill="#ABC6BF">Try an AI agent</text>
    </g>
    <g class="enter" style="--delay:.56s">
      <rect x="51" y="314" width="182" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="66" y="333" class="mono" font-size="13" fill="#A5EFCD" letter-spacing=".7">OPEN LIVE SITE</text>
      <path d="M211 332l8-8m-7 0h7v7" fill="none" stroke="#A5EFCD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(732 57)">
      <rect width="420" height="263" rx="14" fill="#122227" stroke="#315C55"/>
      <rect x="2" y="2" width="416" height="259" rx="12" fill="url(#grid)"/>
      <text x="21" y="30" class="mono" font-size="11" fill="#6BD8AF" letter-spacing="1.4">AUTOMATION SHOWCASE</text>
      <rect x="24" y="47" width="372" height="183" rx="10" fill="#0E171B" stroke="#315C55"/>
      <path d="M24 73h372" stroke="#315C55"/>
      <g fill="#6BD8AF">
        <circle cx="40" cy="60" r="2.8" opacity=".9"/>
        <circle cx="50" cy="60" r="2.8" opacity=".65"/>
        <circle cx="60" cy="60" r="2.8" opacity=".4"/>
      </g>
      <text x="78" y="64" class="mono" font-size="10" fill="#ABC6BF">AI AUTOMATION PORTFOLIO</text>
      <g class="sans">
        <rect x="38" y="87" width="164" height="59" rx="8" fill="#122227" stroke="#315C55"/>
        <circle cx="54" cy="107" r="3" fill="#A5EFCD"/>
        <text x="64" y="111" font-size="14" fill="#F0FCF6">AI agents</text>
        <text x="51" y="132" font-size="12" fill="#ABC6BF">Assistants and chatbots</text>
        <rect x="218" y="87" width="164" height="59" rx="8" fill="#122227" stroke="#315C55"/>
        <circle cx="234" cy="107" r="3" fill="#A5EFCD"/>
        <text x="244" y="111" font-size="14" fill="#F0FCF6">Workflows</text>
        <text x="231" y="132" font-size="12" fill="#ABC6BF">APIs and integrations</text>
        <rect x="38" y="160" width="344" height="54" rx="8" fill="#15312F" stroke="#315C55"/>
        <circle cx="61" cy="187" r="11" fill="#143B36" stroke="#548A7C"/>
        <path d="M59 183l6 4-6 4z" fill="#A5EFCD"/>
        <text x="80" y="183" font-size="14" fill="#F0FCF6">Live AI demo</text>
        <text x="80" y="201" font-size="12" fill="#ABC6BF">Try an interactive prototype</text>
      </g>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="363.8" rx="18.4" fill="none" stroke="#315C55" class="border"/>
  </g>
</svg>
