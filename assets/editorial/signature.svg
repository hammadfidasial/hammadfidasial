      </svg>
      <text x="646" y="102" class="serif" font-size="77" fill="url(#type)" text-anchor="middle" font-style="italic">Hammad Hussain</text>
    </g>
    <path class="draw" pathLength="100" style="--delay:.6s" d="M336 128c155-26 434-27 531-5-129-6-348 5-441 17m-2-1c140-12 257-9 319-3" fill="none" stroke="url(#rail)" stroke-width="2" stroke-linecap="round"/>
    <g class="enter" style="--delay:0.72s">
<text x="600" y="176" class="serif" font-size="24" fill="#F0FCF6" text-anchor="middle" font-style="italic">Open to AI automation projects and collaboration.</text>
    <text x="600" y="205" class="mono" font-size="12" fill="#ABC6BF" text-anchor="middle" letter-spacing="3">MULTAN, PAKISTAN</text>
