<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-labelledby="title desc">
  <title id="title">About Hammad Hussain</title>
  <desc id="desc">Hammad builds AI agents, workflows and full-stack applications for sales, customer support and daily operations. Based in Multan, Pakistan.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0D1418"/><stop offset=".54" stop-color="#14272B"/><stop offset="1" stop-color="#0E1D21"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#186B54" stop-opacity=".64"/><stop offset="1" stop-color="#186B54" stop-opacity="0"/></radialGradient>
    <linearGradient id="type"><stop stop-color="#F0FCF6"/><stop offset="1" stop-color="#57D9A7"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#315C55" stop-opacity=".25"/><stop offset=".47" stop-color="#A5EFCD"/><stop offset="1" stop-color="#315C55" stop-opacity=".25"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#A5EFCD" stop-opacity="0"/><stop offset=".52" stop-color="#A5EFCD" stop-opacity=".32"/><stop offset="1" stop-color="#A5EFCD" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#6BD8AF" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="404" rx="19"/></clipPath>
    <clipPath id="type0"><rect class="type" x="80" y="95" width="620" height="23" style="--delay:0.25s;--steps:6"/></clipPath>
    <clipPath id="type1"><rect class="type" x="80" y="161" width="620" height="23" style="--delay:1.02s;--steps:17"/></clipPath>
    <clipPath id="type2"><rect class="type" x="80" y="227" width="620" height="23" style="--delay:1.79s;--steps:13"/></clipPath>
    <clipPath id="type3"><rect class="type" x="80" y="293" width="620" height="23" style="--delay:2.56s;--steps:13"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .beam,.spark{display:none}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
      .blink{animation:blink 1.25s steps(1) infinite}
      .beam{display:inline;animation:beam 8s linear infinite;animation-delay:var(--delay,0s)}
      .spark{display:inline}
      .glint{animation:glint 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .trace{stroke-dasharray:13 87;animation:trace 5.8s linear infinite;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes beam{0%,8%{transform:translateX(0);opacity:0}12%{opacity:.7}48%,100%{transform:translateX(var(--slide,1050px));opacity:0}}
    @keyframes glint{50%{opacity:.25}}
    @keyframes trace{to{stroke-dashoffset:-100}}
    @media (prefers-reduced-motion:no-preference){
      .type{animation:type .58s steps(var(--steps,12)) both;animation-delay:var(--delay)}
      .response{animation:enter .35s ease-out both;animation-delay:var(--delay)}
    }
    @keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .type{transform-box:fill-box;transform-origin:left center}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="404" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="534" fill="url(#glow)" opacity=".55"/>
    
    
    <rect x="35" y="32" width="724" height="342" rx="13" fill="#0B1317" stroke="#315C55"/>
    <path d="M35 75h724" stroke="#315C55"/>
    <circle cx="56" cy="54" r="4" fill="#6BD8AF"/><circle cx="72" cy="54" r="4" fill="#D6EFA0"/><circle cx="88" cy="54" r="4" fill="#557F74"/>
    <text x="396" y="59" class="mono" font-size="13" fill="#ABC6BF" text-anchor="middle" letter-spacing="1">hammad@portfolio:~</text>
    <text x="54" y="113" class="mono" font-size="17" fill="#6BD8AF" letter-spacing="2">$</text>
    <g clip-path="url(#type0)"><text x="80" y="113" class="mono" font-size="17" fill="#F0FCF6">whoami</text></g>
    <g class="response" style="--delay:0.72s"><text x="80" y="139" class="mono" font-size="16" fill="#ABC6BF">Hammad Hussain · AI Automation &amp; Full-Stack Developer</text></g>
    <text x="54" y="179" class="mono" font-size="17" fill="#6BD8AF" letter-spacing="2">$</text>
    <g clip-path="url(#type1)"><text x="80" y="179" class="mono" font-size="17" fill="#F0FCF6">cat education.txt</text></g>
    <g class="response" style="--delay:1.49s"><text x="80" y="205" class="mono" font-size="16" fill="#ABC6BF">BS Computer Science · University of Southern Punjab</text></g>
    <text x="54" y="245" class="mono" font-size="17" fill="#6BD8AF" letter-spacing="2">$</text>
    <g clip-path="url(#type2)"><text x="80" y="245" class="mono" font-size="17" fill="#F0FCF6">ls ./projects</text></g>
    <g class="response" style="--delay:2.26s"><text x="80" y="271" class="mono" font-size="16" fill="#ABC6BF">kps-portal  counslo  agentic-manager  whatsapp-assistant</text></g>
    <text x="54" y="311" class="mono" font-size="17" fill="#6BD8AF" letter-spacing="2">$</text>
    <g clip-path="url(#type3)"><text x="80" y="311" class="mono" font-size="17" fill="#F0FCF6">cat focus.txt</text></g>
    <g class="response" style="--delay:3.0300000000000002s"><text x="80" y="337" class="mono" font-size="16" fill="#ABC6BF">AI agents, n8n workflows, RAG, CRM and SaaS</text></g>
    <rect class="blink" x="80" y="344" width="8" height="13" fill="#6BD8AF"/>
    <g transform="translate(786 32)">
      <g class="enter" style="--delay:0.27s">
<rect width="379" height="108" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-0.7s" x="1" y="1" width="377" height="106" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <path class="draw" pathLength="100" d="M2 15v78" stroke="#6BD8AF" stroke-width="2"/>
      <text x="22" y="26" class="mono" font-size="12" fill="#6BD8AF" letter-spacing="1.5">AGENTS &amp; RETRIEVAL</text>
      <text x="20" y="62" class="serif" font-size="33" fill="#F0FCF6">RAG &amp; voice AI</text>
      <text x="22" y="86" class="sans" font-size="14" fill="#ABC6BF">Knowledge and support assistants</text>
    </g>
    </g>
    <g transform="translate(786 148)">
      <g class="enter" style="--delay:0.44000000000000006s">
<rect width="379" height="108" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-1.7s" x="1" y="1" width="377" height="106" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <path class="draw" pathLength="100" d="M2 15v78" stroke="#6BD8AF" stroke-width="2"/>
      <text x="22" y="26" class="mono" font-size="12" fill="#6BD8AF" letter-spacing="1.5">WORKFLOW AUTOMATION</text>
      <text x="20" y="62" class="serif" font-size="33" fill="#F0FCF6">n8n &amp; Python</text>
      <text x="22" y="86" class="sans" font-size="14" fill="#ABC6BF">Webhooks and app integrations</text>
    </g>
    </g>
    <g transform="translate(786 264)">
      <g class="enter" style="--delay:0.6100000000000001s">
<rect width="379" height="108" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-2.7s" x="1" y="1" width="377" height="106" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <path class="draw" pathLength="100" d="M2 15v78" stroke="#6BD8AF" stroke-width="2"/>
      <text x="22" y="26" class="mono" font-size="12" fill="#6BD8AF" letter-spacing="1.5">FULL-STACK APPLICATIONS</text>
      <text x="20" y="62" class="serif" font-size="33" fill="#F0FCF6">CRM &amp; SaaS</text>
      <text x="22" y="86" class="sans" font-size="14" fill="#ABC6BF">Apps for day-to-day operations</text>
    </g>
    </g>
        <rect x=".6" y=".6" width="1198.8" height="402.8" rx="18.4" fill="none" stroke="#315C55" class="border"/>
  </g>
</svg>
