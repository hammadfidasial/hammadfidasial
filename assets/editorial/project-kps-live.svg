<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">KPS School Portal</title>
  <desc id="desc">Attendance, exam results and parent access in one portal. Next.js, TypeScript, Supabase, Vercel.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0D1418"/><stop offset=".54" stop-color="#14272B"/><stop offset="1" stop-color="#0E1D21"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#186B54" stop-opacity=".64"/><stop offset="1" stop-color="#186B54" stop-opacity="0"/></radialGradient>
    <linearGradient id="type"><stop stop-color="#F0FCF6"/><stop offset="1" stop-color="#57D9A7"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#315C55" stop-opacity=".25"/><stop offset=".47" stop-color="#A5EFCD"/><stop offset="1" stop-color="#315C55" stop-opacity=".25"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#A5EFCD" stop-opacity="0"/><stop offset=".52" stop-color="#A5EFCD" stop-opacity=".32"/><stop offset="1" stop-color="#A5EFCD" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#6BD8AF" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="365" rx="19"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .beam,.spark{display:none}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
      .blink{animation:blink 1.25s steps(1) infinite}
      .beam{display:inline;animation:beam 8s linear infinite;animation-delay:var(--delay,0s)}
      .spark{display:inline}
      .glint{animation:glint 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .trace{stroke-dasharray:13 87;animation:trace 5.8s linear infinite;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes beam{0%,8%{transform:translateX(0);opacity:0}12%{opacity:.7}48%,100%{transform:translateX(var(--slide,1050px));opacity:0}}
    @keyframes glint{50%{opacity:.25}}
    @keyframes trace{to{stroke-dashoffset:-100}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="365" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="495" fill="url(#glow)" opacity=".55"/>
    <rect x="650" width="550" height="365" fill="url(#grid)"/>
    
    <g class="enter" style="--delay:0.07s">
<text x="50" y="49" class="mono" font-size="14" fill="#6BD8AF" letter-spacing="1.9">01  ·  EDUCATION  ·  SCHOOL OPERATIONS</text>
    <text x="47" y="115" class="serif" font-size="52" fill="#F0FCF6">KPS School Portal</text>
    <text x="51" y="156" class="sans" font-size="20" fill="#ABC6BF">Attendance, exam results and parent access in one portal.</text>
    <text x="52" y="190" class="mono" font-size="15" fill="#A5EFCD">Staff enter records, principals approve results, families see them.</text>
    </g>
    <path class="draw" pathLength="100" d="M50 216h632" stroke="url(#rail)" fill="none"/>
    <g class="enter" style="--delay:0.24s">
<text x="51" y="262" class="serif" font-size="32" fill="#F0FCF6">Attendance</text>
    <text x="52" y="285" class="sans" font-size="15" fill="#ABC6BF">Daily registers</text>
    </g>
    <g class="enter" style="--delay:0.37s">
<text x="266" y="262" class="serif" font-size="32" fill="#F0FCF6">Exams</text>
    <text x="267" y="285" class="sans" font-size="15" fill="#ABC6BF">Marks &amp; approval</text>
    </g>
    <g class="enter" style="--delay:0.5s">
<text x="481" y="262" class="serif" font-size="32" fill="#F0FCF6">Families</text>
    <text x="482" y="285" class="sans" font-size="15" fill="#ABC6BF">Linked children</text>
    </g>
    <g class="enter" style="--delay:0.39s">
      <rect x="51" y="314" width="82.89999999999999" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="92.44999999999999" y="333" class="mono" font-size="13" fill="#A5EFCD" text-anchor="middle" letter-spacing="0.3">Next.js</text>
    </g>
    <g class="enter" style="--delay:0.51s">
      <rect x="142.89999999999998" y="314" width="109" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="197.39999999999998" y="333" class="mono" font-size="13" fill="#A5EFCD" text-anchor="middle" letter-spacing="0.3">TypeScript</text>
    </g>
    <g class="enter" style="--delay:0.63s">
      <rect x="260.9" y="314" width="91.6" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="306.7" y="333" class="mono" font-size="13" fill="#A5EFCD" text-anchor="middle" letter-spacing="0.3">Supabase</text>
    </g>
    <g class="enter" style="--delay:0.75s">
      <rect x="361.5" y="314" width="74.19999999999999" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="398.6" y="333" class="mono" font-size="13" fill="#A5EFCD" text-anchor="middle" letter-spacing="0.3">Vercel</text>
    </g>
    <g>
      <rect x="449" y="314" width="182" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="464" y="333" class="mono" font-size="13" fill="#A5EFCD" letter-spacing=".7">OPEN LIVE PORTAL</text>
      <path d="M609 332l8-8m-7 0h7v7" fill="none" stroke="#A5EFCD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(732 57)">
      <rect width="420" height="263" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-2s" x="1" y="1" width="418" height="261" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <rect x="2" y="2" width="416" height="259" rx="12" fill="url(#grid)"/>
      <text x="21" y="30" class="mono" font-size="11" fill="#6BD8AF" letter-spacing="1.4">RESULTS WORKFLOW</text>
      <path d="M210 105v23H98v23 M172 178h76" fill="none" stroke="#315C55" stroke-width="2"/>
        <path class="draw" pathLength="100" d="M210 105v18H98v29m112-29h112v29" fill="none" stroke="#6BD8AF" stroke-opacity=".65"/>
        <circle class="spark" r="4.5" fill="#A5EFCD"><animateMotion path="M210 105v18H98v29m112-29h112v29" dur="5.7s" repeatCount="indefinite"/></circle>
        <g transform="translate(133 51)">
        <rect width="154" height="55" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:0s" x="1" y="1" width="152" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:0s" fill="#D6EFA0"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#F0FCF6" letter-spacing="0.4">Teacher</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#ABC6BF">Enter marks</text>
      </g><g transform="translate(26 151)">
        <rect width="146" height="55" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-0.73s" x="1" y="1" width="144" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:-0.67s" fill="#D6EFA0"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#F0FCF6" letter-spacing="0.4">Principal</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#ABC6BF">Approve</text>
      </g><g transform="translate(248 151)">
        <rect width="146" height="55" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-1.46s" x="1" y="1" width="144" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:-1.34s" fill="#D6EFA0"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#F0FCF6" letter-spacing="0.4">Parent</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#ABC6BF">View results</text>
      </g>
        <text x="210" y="243" class="mono" font-size="11" fill="#ABC6BF" text-anchor="middle" letter-spacing="1.1">TEACHER → PRINCIPAL → PARENT</text>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="363.8" rx="18.4" fill="none" stroke="#315C55" class="border"/>
  </g>
</svg>
