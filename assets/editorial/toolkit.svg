    <rect pathLength="100" class="trace" style="--delay:-2.68s" x="1" y="1" width="346" height="192" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <text x="23" y="40" class="mono" font-size="13" fill="#6BD8AF" letter-spacing="1.9">CLOUD &amp; DATA</text>
      <text x="21" y="91" class="serif" font-size="31" fill="#F0FCF6">SQL &amp; Supabase</text>
      <text x="23" y="128" class="sans" font-size="18" fill="#A5EFCD">Prisma · Cloudflare D1</text>
      <text x="23" y="156" class="sans" font-size="18" fill="#ABC6BF">Docker · Vercel · GitHub</text>
