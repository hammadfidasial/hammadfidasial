      <text x="23" y="40" class="mono" font-size="13" fill="#6BD8AF" letter-spacing="1.9">AUTOMATION</text>
      <text x="21" y="91" class="serif" font-size="31" fill="#F0FCF6">n8n &amp; Python</text>
      <text x="23" y="128" class="sans" font-size="18" fill="#A5EFCD">Webhooks · REST APIs</text>
