<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">Counslo Admissions Platform</title>
  <desc id="desc">Organizes study-abroad applications and consultancy workflows. Admissions, Applications, Workflows.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#160C13"/><stop offset=".54" stop-color="#27131F"/><stop offset="1" stop-color="#1c0d18"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#803855" stop-opacity=".64"/><stop offset="1" stop-color="#803855" stop-opacity="0"/></radialGradient>
    <linearGradient id="type"><stop stop-color="#FFF2F6"/><stop offset="1" stop-color="#D18AAA"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#724358" stop-opacity=".25"/><stop offset=".47" stop-color="#F1BDD1"/><stop offset="1" stop-color="#724358" stop-opacity=".25"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#F1BDD1" stop-opacity="0"/><stop offset=".52" stop-color="#F1BDD1" stop-opacity=".32"/><stop offset="1" stop-color="#F1BDD1" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#C887A5" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="365" rx="19"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .beam,.spark{display:none}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
      .blink{animation:blink 1.25s steps(1) infinite}
      .beam{display:inline;animation:beam 8s linear infinite;animation-delay:var(--delay,0s)}
      .spark{display:inline}
      .glint{animation:glint 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .trace{stroke-dasharray:13 87;animation:trace 5.8s linear infinite;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes beam{0%,8%{transform:translateX(0);opacity:0}12%{opacity:.7}48%,100%{transform:translateX(var(--slide,1050px));opacity:0}}
    @keyframes glint{50%{opacity:.25}}
    @keyframes trace{to{stroke-dashoffset:-100}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="365" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="495" fill="url(#glow)" opacity=".55"/>
    <rect x="650" width="550" height="365" fill="url(#grid)"/>
    
    <g class="enter" style="--delay:0.07s">
<text x="50" y="49" class="mono" font-size="14" fill="#C887A5" letter-spacing="1.9">03  ·  ADMISSIONS  ·  CONSULTANCY</text>
    <text x="47" y="115" class="serif" font-size="49" fill="#FFF2F6">Counslo Admissions Platform</text>
    <text x="51" y="156" class="sans" font-size="20" fill="#CCB4C0">Organizes study-abroad applications and consultancy workflows.</text>
    <text x="52" y="190" class="mono" font-size="15" fill="#F1BDD1">Keeps student applications and admissions work in one place.</text>
    </g>
    <path class="draw" pathLength="100" d="M50 216h632" stroke="url(#rail)" fill="none"/>
    <g class="enter" style="--delay:0.24s">
<text x="51" y="262" class="serif" font-size="32" fill="#FFF2F6">Students</text>
    <text x="52" y="285" class="sans" font-size="15" fill="#CCB4C0">Application records</text>
    </g>
    <g class="enter" style="--delay:0.37s">
<text x="266" y="262" class="serif" font-size="32" fill="#FFF2F6">Intake</text>
    <text x="267" y="285" class="sans" font-size="15" fill="#CCB4C0">Admissions workflow</text>
    </g>
    <g class="enter" style="--delay:0.5s">
<text x="481" y="262" class="serif" font-size="32" fill="#FFF2F6">Team</text>
    <text x="482" y="285" class="sans" font-size="15" fill="#CCB4C0">Consultancy operations</text>
    </g>
    <g class="enter" style="--delay:0.39s">
      <rect x="51" y="314" width="109" height="28" rx="14" fill="#21111C" stroke="#724358"/>
      <text x="105.5" y="333" class="mono" font-size="13" fill="#F1BDD1" text-anchor="middle" letter-spacing="0.3">Admissions</text>
    </g>
    <g class="enter" style="--delay:0.51s">
      <rect x="169" y="314" width="126.39999999999999" height="28" rx="14" fill="#21111C" stroke="#724358"/>
      <text x="232.2" y="333" class="mono" font-size="13" fill="#F1BDD1" text-anchor="middle" letter-spacing="0.3">Applications</text>
    </g>
    <g class="enter" style="--delay:0.63s">
      <rect x="304.4" y="314" width="100.3" height="28" rx="14" fill="#21111C" stroke="#724358"/>
      <text x="354.54999999999995" y="333" class="mono" font-size="13" fill="#F1BDD1" text-anchor="middle" letter-spacing="0.3">Workflows</text>
    </g>
    <g transform="translate(732 57)">
      <rect width="420" height="263" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-2s" x="1" y="1" width="418" height="261" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <rect x="2" y="2" width="416" height="259" rx="12" fill="url(#grid)"/>
      <text x="21" y="30" class="mono" font-size="11" fill="#C887A5" letter-spacing="1.4">APPLICATION WORKFLOW</text>
      <path d="M125 135h23l15 34h97l15-34h19" fill="none" stroke="#724358" stroke-width="2"/>
        <path class="draw" pathLength="100" d="M125 135h23l15 34h97l15-34h19" fill="none" stroke="#C887A5" stroke-opacity=".65"/>
        <circle class="spark" r="4.5" fill="#F1BDD1"><animateMotion path="M125 135h23l15 34h97l15-34h19" dur="4.7s" repeatCount="indefinite"/></circle>
        <g transform="translate(18 108)">
        <rect width="107" height="55" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:0s" x="1" y="1" width="105" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:0s" fill="#EAB997"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#FFF2F6" letter-spacing="0.4">Student</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#CCB4C0">Profile</text>
      </g><g transform="translate(157 142)">
        <rect width="107" height="55" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-0.73s" x="1" y="1" width="105" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:-0.67s" fill="#EAB997"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#FFF2F6" letter-spacing="0.4">Submit</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#CCB4C0">Application</text>
      </g><g transform="translate(294 108)">
        <rect width="108" height="55" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-1.46s" x="1" y="1" width="106" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:-1.34s" fill="#EAB997"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#FFF2F6" letter-spacing="0.4">Track</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#CCB4C0">Progress</text>
      </g>
        <path d="M50 76H371" stroke="#724358"/>
        <g fill="#C887A5">
          <circle cx="72" cy="76" r="4"/><circle class="glint" cx="210" cy="76" r="4"/><circle cx="348" cy="76" r="4"/>
        </g>
        <text x="210" y="238" class="mono" font-size="11" fill="#CCB4C0" text-anchor="middle" letter-spacing="1.1">STUDENT APPLICATION RECORD</text>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="363.8" rx="18.4" fill="none" stroke="#724358" class="border"/>
  </g>
</svg>
