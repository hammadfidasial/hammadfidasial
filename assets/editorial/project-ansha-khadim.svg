<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Ansha Khadim Portfolio</title>
  <desc id="desc">A professional website for a physiotherapy profile. In development. Planned content covers clinical practice and research.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0D1418"/><stop offset=".54" stop-color="#14272B"/><stop offset="1" stop-color="#0E1D21"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#186B54" stop-opacity=".64"/><stop offset="1" stop-color="#186B54" stop-opacity="0"/></radialGradient>
    <linearGradient id="type"><stop stop-color="#F0FCF6"/><stop offset="1" stop-color="#57D9A7"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#315C55" stop-opacity=".25"/><stop offset=".47" stop-color="#A5EFCD"/><stop offset="1" stop-color="#315C55" stop-opacity=".25"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#A5EFCD" stop-opacity="0"/><stop offset=".52" stop-color="#A5EFCD" stop-opacity=".32"/><stop offset="1" stop-color="#A5EFCD" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#6BD8AF" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="365" rx="19"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .beam,.spark{display:none}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
      .blink{animation:blink 1.25s steps(1) infinite}
      .beam{display:inline;animation:beam 8s linear infinite;animation-delay:var(--delay,0s)}
      .spark{display:inline}
      .glint{animation:glint 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .trace{stroke-dasharray:13 87;animation:trace 5.8s linear infinite;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes beam{0%,8%{transform:translateX(0);opacity:0}12%{opacity:.7}48%,100%{transform:translateX(var(--slide,1050px));opacity:0}}
    @keyframes glint{50%{opacity:.25}}
    @keyframes trace{to{stroke-dashoffset:-100}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="365" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="495" fill="url(#glow)" opacity=".55"/>
    <rect x="650" width="550" height="365" fill="url(#grid)"/>
    
    <g class="enter" style="--delay:.07s">
      <text x="50" y="49" class="mono" font-size="14" fill="#6BD8AF" letter-spacing="1.9">06  ·  CLIENT PORTFOLIO  ·  PHYSIOTHERAPY</text>
      <text x="47" y="115" class="serif" font-size="52" fill="#F0FCF6">Dr. Ansha Khadim Portfolio</text>
      <text x="51" y="156" class="sans" font-size="20" fill="#ABC6BF">A professional website for a physiotherapy profile.</text>
      <text x="52" y="190" class="mono" font-size="15" fill="#A5EFCD">Planned content covers clinical practice and research.</text>
    </g>
    <path class="draw" pathLength="100" d="M50 216h632" stroke="url(#rail)" fill="none"/>
    <g class="enter" style="--delay:0.24s">
      <text x="51" y="262" class="serif" font-size="32" fill="#F0FCF6">Profile</text>
      <text x="52" y="285" class="sans" font-size="15" fill="#ABC6BF">Professional overview</text>
    </g>
    <g class="enter" style="--delay:0.37s">
      <text x="266" y="262" class="serif" font-size="32" fill="#F0FCF6">Practice</text>
      <text x="267" y="285" class="sans" font-size="15" fill="#ABC6BF">Clinical experience</text>
    </g>
    <g class="enter" style="--delay:0.5s">
      <text x="481" y="262" class="serif" font-size="32" fill="#F0FCF6">Research</text>
      <text x="482" y="285" class="sans" font-size="15" fill="#ABC6BF">Academic work</text>
    </g>
    <g class="enter" style="--delay:0.39s">
      <rect x="51" y="314" width="149" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="125.5" y="333" class="mono" font-size="13" fill="#A5EFCD" text-anchor="middle" letter-spacing=".3">In development</text>
    </g>
    <g class="enter" style="--delay:0.51s">
      <rect x="210" y="314" width="132" height="28" rx="14" fill="#122227" stroke="#315C55"/>
      <text x="276" y="333" class="mono" font-size="13" fill="#A5EFCD" text-anchor="middle" letter-spacing=".3">Private repo</text>
    </g>
    <g transform="translate(732 57)">
      <rect width="420" height="263" rx="14" fill="#122227" stroke="#315C55"/>
      <rect x="2" y="2" width="416" height="259" rx="12" fill="url(#grid)"/>
      <rect pathLength="100" class="trace" style="--delay:-1s" x="1" y="1" width="418" height="261" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <text x="21" y="30" class="mono" font-size="11" fill="#6BD8AF" letter-spacing="1.4">PLANNED SITE STRUCTURE</text>
      <path class="draw" pathLength="100" d="M24 55H396V233H24Z" stroke="#315C55" fill="none"/>
      <rect x="28" y="60" width="364" height="167" rx="10" fill="#0D1418" stroke="#315C55"/>
      <path d="M29 85H391" stroke="#315C55"/>
      <circle cx="43" cy="73" r="3" fill="#6BD8AF"/>
      <circle cx="54" cy="73" r="3" fill="#557F74"/>
      <circle cx="65" cy="73" r="3" fill="#315C55"/>
      <rect x="43" y="104" width="90" height="104" rx="9" fill="#14272B" stroke="#315C55"/>
      <circle class="glint" style="--delay:-0s" cx="88" cy="147" r="24" fill="#21413B" stroke="#6BD8AF"/>
      <text x="88" y="153" class="serif" font-size="19" fill="#F0FCF6" text-anchor="middle">AK</text>
      <path d="M63 185H113" stroke="#315C55"/>
      <text x="151" y="111" class="mono" font-size="11" fill="#6BD8AF" letter-spacing="1.3">OVERVIEW</text>
      <rect x="151" y="122" width="224" height="22" rx="5" fill="#122227" stroke="#315C55"/>
      <circle cx="161" cy="133" r="2.5" fill="#D6EFA0"/>
      <text x="171" y="137" class="sans" font-size="12" fill="#ABC6BF">Clinical practice</text>
      <rect x="151" y="151" width="224" height="22" rx="5" fill="#122227" stroke="#315C55"/>
      <circle cx="161" cy="162" r="2.5" fill="#D6EFA0"/>
      <text x="171" y="166" class="sans" font-size="12" fill="#ABC6BF">Research interests</text>
      <rect x="151" y="180" width="224" height="22" rx="5" fill="#122227" stroke="#315C55"/>
      <circle cx="161" cy="191" r="2.5" fill="#D6EFA0"/>
      <text x="171" y="195" class="sans" font-size="12" fill="#ABC6BF">Education</text>
      <path d="M30 238H390" stroke="#315C55"/>
      <path class="trace" pathLength="100" d="M30 238H390" stroke="url(#rail)" fill="none"/>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="363.8" rx="18.4" fill="none" stroke="#315C55" class="border"/>
  </g>
</svg>
