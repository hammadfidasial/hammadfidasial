<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="146" viewBox="0 0 1200 146" role="img" aria-labelledby="title desc">
  <title id="title">Khatoon-e-Pakistan School Website</title>
  <desc id="desc">Public website for Khatoon-e-Pakistan Government Girls Secondary School.</desc>
  <defs>
