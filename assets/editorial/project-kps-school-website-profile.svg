    <text x="47" y="68" class="serif" font-size="40" fill="#F0FCF6">Khatoon-e-Pakistan School Website</text>
    <text x="51" y="104" class="sans" font-size="18" fill="#ABC6BF">Public website for Khatoon-e-Pakistan Government Girls Secondary School.</text>
    <g>
