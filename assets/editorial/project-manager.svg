<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI Project Manager</title>
  <desc id="desc">Suggests who should take on a task and when it could be due. AI agents, Task planning, FYP.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#160C13"/><stop offset=".54" stop-color="#27131F"/><stop offset="1" stop-color="#1c0d18"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#803855" stop-opacity=".64"/><stop offset="1" stop-color="#803855" stop-opacity="0"/></radialGradient>
    <linearGradient id="type"><stop stop-color="#FFF2F6"/><stop offset="1" stop-color="#D18AAA"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#724358" stop-opacity=".25"/><stop offset=".47" stop-color="#F1BDD1"/><stop offset="1" stop-color="#724358" stop-opacity=".25"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#F1BDD1" stop-opacity="0"/><stop offset=".52" stop-color="#F1BDD1" stop-opacity=".32"/><stop offset="1" stop-color="#F1BDD1" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#C887A5" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="365" rx="19"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .beam,.spark{display:none}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
      .blink{animation:blink 1.25s steps(1) infinite}
      .beam{display:inline;animation:beam 8s linear infinite;animation-delay:var(--delay,0s)}
      .spark{display:inline}
      .glint{animation:glint 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .trace{stroke-dasharray:13 87;animation:trace 5.8s linear infinite;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes beam{0%,8%{transform:translateX(0);opacity:0}12%{opacity:.7}48%,100%{transform:translateX(var(--slide,1050px));opacity:0}}
    @keyframes glint{50%{opacity:.25}}
    @keyframes trace{to{stroke-dashoffset:-100}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="365" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="495" fill="url(#glow)" opacity=".55"/>
    <rect x="650" width="550" height="365" fill="url(#grid)"/>
    
    <g class="enter" style="--delay:0.07s">
<text x="50" y="49" class="mono" font-size="14" fill="#C887A5" letter-spacing="1.9">02  ·  AGENTIC AI  ·  FINAL-YEAR PROJECT</text>
    <text x="47" y="115" class="serif" font-size="52" fill="#FFF2F6">Agentic AI Project Manager</text>
    <text x="51" y="156" class="sans" font-size="20" fill="#CCB4C0">Suggests who should take on a task and when it could be due.</text>
    <text x="52" y="190" class="mono" font-size="15" fill="#F1BDD1">Turns project work into suggested assignments and deadlines.</text>
    </g>
    <path class="draw" pathLength="100" d="M50 216h632" stroke="url(#rail)" fill="none"/>
    <g class="enter" style="--delay:0.24s">
<text x="51" y="262" class="serif" font-size="32" fill="#FFF2F6">Tasks</text>
    <text x="52" y="285" class="sans" font-size="15" fill="#CCB4C0">Work breakdown</text>
    </g>
    <g class="enter" style="--delay:0.37s">
<text x="266" y="262" class="serif" font-size="32" fill="#FFF2F6">People</text>
    <text x="267" y="285" class="sans" font-size="15" fill="#CCB4C0">Task allocation</text>
    </g>
    <g class="enter" style="--delay:0.5s">
<text x="481" y="262" class="serif" font-size="32" fill="#FFF2F6">Dates</text>
    <text x="482" y="285" class="sans" font-size="15" fill="#CCB4C0">Deadline suggestions</text>
    </g>
    <g class="enter" style="--delay:0.39s">
      <rect x="51" y="314" width="100.3" height="28" rx="14" fill="#21111C" stroke="#724358"/>
      <text x="101.15" y="333" class="mono" font-size="13" fill="#F1BDD1" text-anchor="middle" letter-spacing="0.3">AI agents</text>
    </g>
    <g class="enter" style="--delay:0.51s">
      <rect x="160.3" y="314" width="135.1" height="28" rx="14" fill="#21111C" stroke="#724358"/>
      <text x="227.85000000000002" y="333" class="mono" font-size="13" fill="#F1BDD1" text-anchor="middle" letter-spacing="0.3">Task planning</text>
    </g>
    <g class="enter" style="--delay:0.63s">
      <rect x="304.4" y="314" width="48.099999999999994" height="28" rx="14" fill="#21111C" stroke="#724358"/>
      <text x="328.45" y="333" class="mono" font-size="13" fill="#F1BDD1" text-anchor="middle" letter-spacing="0.3">FYP</text>
    </g>
    <g transform="translate(732 57)">
      <rect width="420" height="263" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-2s" x="1" y="1" width="418" height="261" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <rect x="2" y="2" width="416" height="259" rx="12" fill="url(#grid)"/>
      <text x="21" y="30" class="mono" font-size="11" fill="#C887A5" letter-spacing="1.4">PLANNING WORKFLOW</text>
      <path d="M139 93H159M262 93H282" fill="none" stroke="#724358" stroke-width="2"/>
        <path class="draw" pathLength="100" d="M139 93H159M262 93H282" fill="none" stroke="#C887A5" stroke-opacity=".65"/>
        <circle class="spark" r="4.5" fill="#F1BDD1"><animateMotion path="M139 93H159M262 93H282" dur="4.1s" repeatCount="indefinite"/></circle>
        <g transform="translate(21 66)">
        <rect width="118" height="55" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:0s" x="1" y="1" width="116" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:0s" fill="#EAB997"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#FFF2F6" letter-spacing="0.4">Input</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#CCB4C0">Project tasks</text>
      </g><g transform="translate(159 66)">
        <rect width="103" height="55" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-0.73s" x="1" y="1" width="101" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:-0.67s" fill="#EAB997"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#FFF2F6" letter-spacing="0.4">Agent</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#CCB4C0">Suggest plan</text>
      </g><g transform="translate(282 66)">
        <rect width="119" height="55" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-1.46s" x="1" y="1" width="117" height="53" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
        <circle cx="15" cy="18" r="3.5" class="glint" style="--delay:-1.34s" fill="#EAB997"/>
        <text x="26" y="23" class="mono" font-size="13" fill="#FFF2F6" letter-spacing="0.4">Review</text>
        <text x="26" y="43" class="sans" font-size="13" fill="#CCB4C0">Owners &amp; dates</text>
      </g>
        <g transform="translate(34 153)">
          <rect width="352" height="71" rx="14" fill="#21111C" stroke="#724358"/>
    <rect pathLength="100" class="trace" style="--delay:-1.2s" x="1" y="1" width="350" height="69" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
          <path d="M20 45h300" fill="none" stroke="#724358"/>
          <rect x="20" y="37" width="92" height="14" rx="7" fill="#8F405F"/>
          <rect class="glint" x="117" y="37" width="108" height="14" rx="7" fill="#C887A5"/>
          <rect x="230" y="37" width="90" height="14" rx="7" fill="#EAB997" opacity=".65"/>
          <text x="20" y="24" class="mono" font-size="11" fill="#C887A5" letter-spacing="1">SUGGESTED TASK TIMELINE</text>
        </g>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="363.8" rx="18.4" fill="none" stroke="#724358" class="border"/>
  </g>
</svg>
