<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="title desc">
  <title id="title">Education and experience</title>
  <desc id="desc">BS Computer Science, University of Southern Punjab, 2022 to 2026. CTO at Counslo. Earlier roles include e-commerce and data management and research and development.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#0D1418"/><stop offset=".54" stop-color="#14272B"/><stop offset="1" stop-color="#0E1D21"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#186B54" stop-opacity=".64"/><stop offset="1" stop-color="#186B54" stop-opacity="0"/></radialGradient>
    <linearGradient id="type"><stop stop-color="#F0FCF6"/><stop offset="1" stop-color="#57D9A7"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#315C55" stop-opacity=".25"/><stop offset=".47" stop-color="#A5EFCD"/><stop offset="1" stop-color="#315C55" stop-opacity=".25"/></linearGradient>
    <linearGradient id="sheen"><stop stop-color="#A5EFCD" stop-opacity="0"/><stop offset=".52" stop-color="#A5EFCD" stop-opacity=".32"/><stop offset="1" stop-color="#A5EFCD" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#6BD8AF" stroke-opacity=".13"/></pattern>
    <clipPath id="panel"><rect width="1200" height="392" rx="19"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,"Times New Roman",serif}
    .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .sans{font-family:system-ui,"Segoe UI",sans-serif}
    .beam,.spark{display:none}
    .border{opacity:.55}
    @media (prefers-reduced-motion:no-preference){
      .enter{animation:enter .85s cubic-bezier(.21,.7,.25,1) both;animation-delay:var(--delay,0s)}
      .draw{animation:draw 1.55s ease-out both;animation-delay:var(--delay,0s)}
      .blink{animation:blink 1.25s steps(1) infinite}
      .beam{display:inline;animation:beam 8s linear infinite;animation-delay:var(--delay,0s)}
      .spark{display:inline}
      .glint{animation:glint 3.5s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .trace{stroke-dasharray:13 87;animation:trace 5.8s linear infinite;animation-delay:var(--delay,0s)}
    }
    @keyframes enter{from{opacity:0;transform:translateY(12px)}}
    @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes beam{0%,8%{transform:translateX(0);opacity:0}12%{opacity:.7}48%,100%{transform:translateX(var(--slide,1050px));opacity:0}}
    @keyframes glint{50%{opacity:.25}}
    @keyframes trace{to{stroke-dashoffset:-100}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="392" fill="url(#base)"/>
    <ellipse cx="895" cy="0" rx="600" ry="522" fill="url(#glow)" opacity=".55"/>
    
    
    <g transform="translate(35 29)">
      
      <rect width="658" height="219" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-0.7s" x="1" y="1" width="656" height="217" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <text x="630" y="91" class="serif" font-size="85" fill="#467769" text-anchor="end" font-style="italic">2022–2026</text>
      <g transform="translate(66 65)" fill="none" stroke="#6BD8AF" opacity=".55">
    <path d="M0-37 37 0 0 37-37 0Z"/><circle r="23"/>
    <path d="M0-30v60M-30 0h60" stroke-dasharray="2 5"/>
    <path class="trace" pathLength="100" d="M0-37 37 0 0 37-37 0Z" stroke="#A5EFCD" stroke-width="2"/>
    <circle r="6" fill="#D6EFA0" stroke="none" class="glint"/>
    </g>
      <text x="25" y="119" class="mono" font-size="13" fill="#6BD8AF" letter-spacing="1.7">EDUCATION</text>
      <text x="23" y="169" class="serif" font-size="46" fill="#F0FCF6">BS Computer Science</text>
      <text x="25" y="195" class="sans" font-size="17" fill="#ABC6BF">University of Southern Punjab</text>
    </g>
    <g transform="translate(717 29)">
      
      <rect width="448" height="219" rx="14" fill="#122227" stroke="#315C55"/>
    <rect pathLength="100" class="trace" style="--delay:-1.7s" x="1" y="1" width="446" height="217" rx="13" fill="none" stroke="url(#rail)" stroke-width="1.2" opacity=".72"/>
      <text x="420" y="91" class="serif" font-size="85" fill="#467769" text-anchor="end" font-style="italic">2026</text>
      <g transform="translate(66 65)" fill="none" stroke="#6BD8AF" opacity=".55">
    <path d="M0-37 37 0 0 37-37 0Z"/><circle r="23"/>
    <path d="M0-30v60M-30 0h60" stroke-dasharray="2 5"/>
    <path class="trace" pathLength="100" d="M0-37 37 0 0 37-37 0Z" stroke="#A5EFCD" stroke-width="2"/>
    <circle r="6" fill="#D6EFA0" stroke="none" class="glint"/>
    </g>
      <text x="25" y="119" class="mono" font-size="13" fill="#6BD8AF" letter-spacing="1.7">WORK EXPERIENCE</text>
      <text x="23" y="169" class="serif" font-size="41" fill="#F0FCF6">CTO at Counslo</text>
      <text x="25" y="195" class="sans" font-size="17" fill="#ABC6BF">Admissions systems · Technical delivery</text>
    </g>
    <path class="draw" pathLength="100" d="M52 271H1148" fill="none" stroke="url(#rail)"/>
    <path d="M600 293v70" stroke="#315C55"/>
    <g class="enter" style="--delay:0.36s">
<text x="51" y="305" class="mono" font-size="13" fill="#6BD8AF" letter-spacing="0.8">JAN–AUG 2025 · PRIME INFORMATION TECHNOLOGY GROUP</text>
    <text x="49" y="344" class="serif" font-size="29" fill="#F0FCF6">E-commerce &amp; Data Manager</text>
    <text x="627" y="305" class="mono" font-size="13" fill="#6BD8AF" letter-spacing="0.8">AUG–OCT 2025 · COUNSLO</text>
    <text x="625" y="344" class="serif" font-size="29" fill="#F0FCF6">Research &amp; Development Intern</text>
    </g>
    <rect x=".6" y=".6" width="1198.8" height="390.8" rx="18.4" fill="none" stroke="#315C55" class="border"/>
  </g>
</svg>
