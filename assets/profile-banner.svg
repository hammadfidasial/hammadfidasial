  <!-- Hand-drawn style mint underline under "Hi," -->
  <path d="M64 150 C88 144, 114 143, 134 147" stroke="#8df1d0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M74 156 Q104 152 126 154" stroke="#8df1d0" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- Subtitle -->
