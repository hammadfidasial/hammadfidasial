      <stop offset="0%" stop-color="#8df1d0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1b1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091316"/>
      <stop offset="55%" stop-color="#0d1b1e"/>
      <stop offset="100%" stop-color="#11262b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="18" fill="url(#mintGlow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" stroke="#24403e" stroke-width="1.5"/>

  <!-- Pill badge -->
  <rect x="64" y="48" width="295" height="30" rx="15" fill="#13292d" stroke="#2f5753" stroke-width="1"/>
  <circle cx="82" cy="63" r="4" fill="#8df1d0"/>
  <text x="96" y="68" fill="#8df1d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.2">MULTAN, PAKISTAN • AVAILABLE</text>

