  <text x="64" y="232" fill="#b5c8c8" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16.5">Building custom web portals, AI agents, and automated workflows that eliminate repetitive manual tasks.</text>

  <!-- Right decorative terminal/workflow node graphic -->
