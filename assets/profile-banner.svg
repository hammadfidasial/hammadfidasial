    <text x="18" y="66" fill="#8df1d0" font-family="ui-monospace, Consolas, monospace" font-size="12">→ AI Agents & RAG</text>
    <text x="18" y="94" fill="#e4eeeb" font-family="ui-monospace, Consolas, monospace" font-size="12">→ Next.js & Supabase</text>
