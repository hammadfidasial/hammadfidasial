    <rect x="0" y="0" width="220" height="184" rx="14" fill="#102125" stroke="#2c4e4b" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="4.5" fill="#8df1d0"/>
    <circle cx="35" cy="20" r="4.5" fill="#3b6964"/>
    <circle cx="50" cy="20" r="4.5" fill="#274744"/>
