<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img">
<title>Hammad Hussain — AI Automation and Agentic AI Developer</title>
<defs>
  <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#0c1428"/><stop offset="1" stop-color="#211840"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8da2fb" stroke-opacity=".13"/></pattern>
</defs>
<style>
  @media (prefers-reduced-motion: no-preference) {
    .orbit { transform-origin: 690px 130px; animation: orbit 8s linear infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }
    .cursor { animation: pulse 1.4s ease-in-out infinite alternate; }
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
</style>
<rect x="1" y="1" width="878" height="258" rx="22" fill="url(#panel)" stroke="#3b4267"/>
<rect x="1" y="1" width="878" height="258" rx="22" fill="url(#grid)"/>
<g font-family="system-ui, sans-serif">
  <text x="48" y="111" fill="#f8fafc" font-size="58" font-weight="750">Hammad Hussain</text>
  <text x="51" y="155" fill="#a5f3fc" font-size="27" font-weight="600">AI Automation &amp; Agentic AI</text>
  <text x="51" y="198" fill="#cbd5e1" font-size="20" font-family="monospace">AI Agents / n8n / RAG / SaaS</text>
</g>
<rect class="cursor" x="385" y="181" width="10" height="20" rx="2" fill="#67e8f9"/>
<g fill="none">
  <circle cx="690" cy="130" r="98" stroke="#7381b1" stroke-opacity=".45"/>
  <circle cx="690" cy="130" r="73" stroke="#8b80bd" stroke-dasharray="3 8"/>
  <circle class="pulse" cx="690" cy="130" r="46" fill="#181c38" stroke="url(#accent)" stroke-width="2"/>
  <path d="m678 116-14 14 14 14m24-28 14 14-14 14m-7-31-10 34" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="orbit"><circle cx="690" cy="32" r="6" fill="#67e8f9"/><circle cx="690" cy="32" r="12" fill="#67e8f9" opacity=".18"/><circle cx="690" cy="228" r="5" fill="#c4b5fd"/></g>
