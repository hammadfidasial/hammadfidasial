<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 205" width="960" height="205" role="img" aria-labelledby="title description">
  <title id="title">AI agent workflow</title>
  <desc id="description">A request arrives through a webhook. The workflow retrieves context, calls tools, and writes the result to an application.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: signal 6s linear infinite; }
      .mark { animation: pulse 6s ease-in-out infinite; }
      .two { animation-delay: 1.5s; }
      .three { animation-delay: 3s; }
      .four { animation-delay: 4.5s; }
    }
    @keyframes signal { to { stroke-dashoffset: -924; } }
    @keyframes pulse { 25% { stroke-opacity: 1; } 0%, 50%, 100% { stroke-opacity: .2; } }
  </style>
  <rect width="960" height="205" rx="17" fill="#0B2029"/>
  <text x="37" y="44" fill="#F1FFFC" font-size="27" font-weight="720">Inside an AI agent workflow</text>
  <path d="M105 106H850" stroke="#477472" stroke-width="2"/>
  <path class="signal" d="M105 106H850" stroke="#8FECD5" stroke-width="3" stroke-dasharray="98 826"/>
  <g fill="#0B2029" stroke="#76E4C8" stroke-width="2">
    <circle class="mark" cx="105" cy="106" r="15"/><circle class="mark two" cx="355" cy="106" r="15"/>
    <circle class="mark three" cx="605" cy="106" r="15"/><circle class="mark four" cx="850" cy="106" r="15"/>
  </g>
  <g fill="#FFCF8A">
    <circle cx="105" cy="106" r="5"/><circle cx="355" cy="106" r="5"/>
    <circle cx="605" cy="106" r="5"/><circle cx="850" cy="106" r="5"/>
  </g>
  <g fill="#D4E7E8" text-anchor="middle" font-size="22" font-weight="620">
    <text x="105" y="159">Webhook</text><text x="355" y="159">Retrieval</text><text x="605" y="159">Tool calls</text><text x="850" y="159">App update</text>
  </g>
</svg>
